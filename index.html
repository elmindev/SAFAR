E\u064A\u0652\u0647\u0650",bosnian:"Djela se vrednuju prema namjerama i svakom \u010Dovjeku pripada ono \u0161to je naumio. Pa \u010Dija hid\u017Era bude radi dunjaluka koji \u017Eeli posti\u0107i ili radi \u017Eene kojom se \u017Eeli o\u017Eeniti \u2014 njegova hid\u017Era je za ono radi \u010Dega ju je u\u010Dinio.",context:null,english:`I heard Allah's Messenger (\uFDFA) saying, "The reward of deeds depends upon the intentions and every person will get the reward according to what he has intended. So whoever emigrated for worldly benefits or for a woman to marry, his emigration was for what he emigrated for."`,englishNarrator:"Narrated 'Umar bin Al-Khattab:",translatorEn:"Dr. M. Muhsin Khan",grade:"sahih",gradeSource:"Zbirka Sahih al-Bukhari (konsenzus o vjerodostojnosti); ocjena u skupu podataka sunnah.com: \u201ESahih\u201C",sourceUrl:"https://sunnah.com/bukhari:1"},{id:"bukhari:13",collection:"Sahih al-Bukhari",collectionAr:"\u0635\u062D\u064A\u062D \u0627\u0644\u0628\u062E\u0627\u0631\u064A",number:"13",inBook:"Book 2, Hadith 6",narrator:"Enes ibn Malik, r.a.",topic:"bratstvo",arabic:"\u0644\u0627 \u064A\u064F\u0624\u0652\u0645\u0650\u0646\u064F \u0623\u064E\u062D\u064E\u062F\u064F\u0643\u064F\u0645\u0652 \u062D\u064E\u062A\u064E\u0651\u0649 \u064A\u064F\u062D\u0650\u0628\u064E\u0651 \u0644\u0623\u064E\u062E\u0650\u064A\u0647\u0650 \u0645\u064E\u0627 \u064A\u064F\u062D\u0650\u0628\u064F\u0651 \u0644\u0650\u0646\u064E\u0641\u0652\u0633\u0650\u0647\u0650",bosnian:"Niko od vas ne\u0107e (istinski) vjerovati dok ne bude \u017Eelio svome bratu ono \u0161to \u017Eeli sebi.",context:null,english:'The Prophet (\uFDFA) said, "None of you will have faith till he wishes for his (Muslim) brother what he likes for himself."',englishNarrator:"Narrated Anas:",translatorEn:"Dr. M. Muhsin Khan",grade:"sahih",gradeSource:"Zbirka Sahih al-Bukhari (konsenzus o vjerodostojnosti); ocjena u skupu podataka sunnah.com: \u201ESahih\u201C",sourceUrl:"https://sunnah.com/bukhari:13"},{id:"bukhari:6018",collection:"Sahih al-Bukhari",collectionAr:"\u0635\u062D\u064A\u062D \u0627\u0644\u0628\u062E\u0627\u0631\u064A",number:"6018",inBook:"Book 78, Hadith 49",narrator:"Ebu Hurejre, r.a.",topic:"kom\u0161ija, gost, govor",arabic:"\u0645\u064E\u0646\u0652 \u0643\u064E\u0627\u0646\u064E \u064A\u064F\u0624\u0652\u0645\u0650\u0646\u064F \u0628\u0650\u0627\u0644\u0644\u0651\u064E\u0647\u0650 \u0648\u064E\u0627\u0644\u0652\u064A\u064E\u0648\u0652\u0645\u0650 \u0627\u0644\u0622\u062E\u0650\u0631\u0650 \u0641\u064E\u0644\u0627\u064E \u064A\u064F\u0624\u0652\u0630\u0650 \u062C\u064E\u0627\u0631\u064E\u0647\u064F\u060C \u0648\u064E\u0645\u064E\u0646\u0652 \u0643\u064E\u0627\u0646\u064E \u064A\u064F\u0624\u0652\u0645\u0650\u0646\u064F \u0628\u0650\u0627\u0644\u0644\u0651\u064E\u0647\u0650 \u0648\u064E\u0627\u0644\u0652\u064A\u064E\u0648\u0652\u0645\u0650 \u0627\u0644\u0622\u062E\u0650\u0631\u0650 \u0641\u064E\u0644\u0652\u064A\u064F\u0643\u0652\u0631\u0650\u0645\u0652 \u0636\u064E\u064A\u0652\u0641\u064E\u0647\u064F\u060C \u0648\u064E\u0645\u064E\u0646\u0652 \u0643\u064E\u0627\u0646\u064E \u064A\u064F\u0624\u0652\u0645\u0650\u0646\u064F \u0628\u0650\u0627\u0644\u0644\u0651\u064E\u0647\u0650 \u0648\u064E\u0627\u0644\u0652\u064A\u064E\u0648\u0652\u0645\u0650 \u0627\u0644\u0622\u062E\u0650\u0631\u0650 \u0641\u064E\u0644\u0652\u064A\u064E\u0642\u064F\u0644\u0652 \u062E\u064E\u064A\u0652\u0631\u064B\u0627 \u0623\u064E\u0648\u0652 \u0644\u0650\u064A\u064E\u0635\u0652\u0645\u064F\u062A\u0652",bosnian:"Ko vjeruje u Allaha i Sudnji dan, neka ne uznemirava svoga kom\u0161iju; ko vjeruje u Allaha i Sudnji dan, neka po\u010Dasti svoga gosta; ko vjeruje u Allaha i Sudnji dan, neka govori dobro ili neka \u0161uti.",context:null,english:`Allah's Messenger (\uFDFA) said, "Anybody who believes in Allah and the Last Day should not harm his neighbor, and anybody who believes in Allah and the Last Day should entertain his guest generously and anybody who believes in Allah and the Last Day should talk what is good or keep quiet. (i.e. abstain from all kinds of evil and dirty talk).`,englishNarrator:"Narrated Abu Huraira:",translatorEn:"Dr. M. Muhsin Khan",grade:"sahih",gradeSource:"Zbirka Sahih al-Bukhari (konsenzus o vjerodostojnosti); ocjena u skupu podataka sunnah.com: \u201ESahih\u201C",sourceUrl:"https://sunnah.com/bukhari:6018"},{id:"bukhari:6011",collection:"Sahih al-Bukhari",collectionAr:"\u0635\u062D\u064A\u062D \u0627\u0644\u0628\u062E\u0627\u0631\u064A",number:"6011",inBook:"Book 78, Hadith 42",narrator:"En-Nu\u2018man ibn Be\u0161ir, r.a.",topic:"zajedni\u0161tvo",arabic:"\u062A\u064E\u0631\u064E\u0649 \u0627\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u0650\u064A\u0646\u064E \u0641\u0650\u064A \u062A\u064E\u0631\u064E\u0627\u062D\u064F\u0645\u0650\u0647\u0650\u0645\u0652 \u0648\u064E\u062A\u064E\u0648\u064E\u0627\u062F\u0651\u0650\u0647\u0650\u0645\u0652 \u0648\u064E\u062A\u064E\u0639\u064E\u0627\u0637\u064F\u0641\u0650\u0647\u0650\u0645\u0652 \u0643\u064E\u0645\u064E\u062B\u064E\u0644\u0650 \u0627\u0644\u0652\u062C\u064E\u0633\u064E\u062F\u0650 \u0625\u0650\u0630\u064E\u0627 \u0627\u0634\u0652\u062A\u064E\u0643\u064E\u0649 \u0639\u064F\u0636\u0652\u0648\u064B\u0627 \u062A\u064E\u062F\u064E\u0627\u0639\u064E\u0649 \u0644\u064E\u0647\u064F \u0633\u064E\u0627\u0626\u0650\u0631\u064F \u062C\u064E\u0633\u064E\u062F\u0650\u0647\u0650 \u0628\u0650\u0627\u0644\u0633\u0651\u064E\u0647\u064E\u0631\u0650 \u0648\u064E\u0627\u0644\u0652\u062D\u064F\u0645\u0651\u064E\u0649",bosnian:"Vidi\u0161 vjernike u njihovoj me\u0111usobnoj milosti, ljubavi i samilosti kao jedno tijelo: kada jedan organ oboli, cijelo tijelo mu se odazove nesanicom i groznicom.",context:null,english:`Allah's Messenger (\uFDFA) said, "You see the believers as regards their being merciful among themselves and showing love among themselves and being kind, resembling one body, so that, if any part of the body is not well then the whole body shares the sleeplessness (insomnia) and fever with it."`,englishNarrator:"Narrated An-Nu`man bin Bashir:",translatorEn:"Dr. M. Muhsin Khan",grade:"sahih",gradeSource:"Zbirka Sahih al-Bukhari (konsenzus o vjerodostojnosti); ocjena u skupu podataka sunnah.com: \u201ESahih\u201C",sourceUrl:"https://sunnah.com/bukhari:6011"},{id:"bukhari:2442",collection:"Sahih al-Bukhari",collectionAr:"\u0635\u062D\u064A\u062D \u0627\u0644\u0628\u062E\u0627\u0631\u064A",number:"2442",inBook:"Book 46, Hadith 3",narrator:"Abdullah ibn Omer, r.a.",topic:"pomo\u0107 bratu",arabic:"\u0627\u0644\u0652\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u064F \u0623\u064E\u062E\u064F\u0648 \u0627\u0644\u0652\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u0650\u060C \u0644\u0627\u064E \u064A\u064E\u0638\u0652\u0644\u0650\u0645\u064F\u0647\u064F \u0648\u064E\u0644\u0627\u064E \u064A\u064F\u0633\u0652\u0644\u0650\u0645\u064F\u0647\u064F\u060C \u0648\u064E\u0645\u064E\u0646\u0652 \u0643\u064E\u0627\u0646\u064E \u0641\u0650\u064A \u062D\u064E\u0627\u062C\u064E\u0629\u0650 \u0623\u064E\u062E\u0650\u064A\u0647\u0650 \u0643\u064E\u0627\u0646\u064E \u0627\u0644\u0644\u0651\u064E\u0647\u064F \u0641\u0650\u064A \u062D\u064E\u0627\u062C\u064E\u062A\u0650\u0647\u0650\u060C \u0648\u064E\u0645\u064E\u0646\u0652 \u0641\u064E\u0631\u0651\u064E\u062C\u064E \u0639\u064E\u0646\u0652 \u0645\u064F\u0633\u0652\u0644\u0650\u0645\u064D \u0643\u064F\u0631\u0652\u0628\u064E\u0629\u064B \u0641\u064E\u0631\u0651\u064E\u062C\u064E \u0627\u0644\u0644\u0651\u064E\u0647\u064F \u0639\u064E\u0646\u0652\u0647\u064F \u0643\u064F\u0631\u0652\u0628\u064E\u0629\u064B \u0645\u0650\u0646\u0652 \u0643\u064F\u0631\u064F\u0628\u064E\u0627\u062A\u0650 \u064A\u064E\u0648\u0652\u0645\u0650 \u0627\u0644\u0652\u0642\u0650\u064A\u064E\u0627\u0645\u064E\u0629\u0650\u060C \u0648\u064E\u0645\u064E\u0646\u0652 \u0633\u064E\u062A\u064E\u0631\u064E \u0645\u064F\u0633\u0652\u0644\u0650\u0645\u064B\u0627 \u0633\u064E\u062A\u064E\u0631\u064E\u0647\u064F \u0627\u0644\u0644\u0651\u064E\u0647\u064F \u064A\u064E\u0648\u0652\u0645\u064E \u0627\u0644\u0652\u0642\u0650\u064A\u064E\u0627\u0645\u064E\u0629\u0650",bosnian:"Musliman je brat muslimanu: ne \u010Dini mu nepravdu i ne ostavlja ga (bez pomo\u0107i). Ko bude u potrebi svoga brata, Allah \u0107e biti u njegovoj potrebi; ko muslimanu otkloni jednu nevolju, Allah \u0107e njemu otkloniti jednu od nevolja Sudnjeg dana; a ko pokrije (manu) muslimana, Allah \u0107e pokriti njega na Sudnjem danu.",context:null,english:`Allah's Messenger (\uFDFA) said, "A Muslim is a brother of another Muslim, so he should not oppress him, nor should he hand him over to an oppressor. Whoever fulfilled the needs of his brother, Allah will fulfill his needs; whoever brought his (Muslim) brother out of a discomfort, Allah will bring him out of the discomforts of the Day of Resurrection, and whoever screened a Muslim, Allah will screen him on the Day of Resurrection . "`,englishNarrator:"Narrated `Abdullah bin `Umar:",translatorEn:"Dr. M. Muhsin Khan",grade:"sahih",gradeSource:"Zbirka Sahih al-Bukhari (konsenzus o vjerodostojnosti); ocjena u skupu podataka sunnah.com: \u201ESahih\u201C",sourceUrl:"https://sunnah.com/bukhari:2442"},{id:"bukhari:6114",collection:"Sahih al-Bukhari",collectionAr:"\u0635\u062D\u064A\u062D \u0627\u0644\u0628\u062E\u0627\u0631\u064A",number:"6114",inBook:"Book 78, Hadith 141",narrator:"Ebu Hurejre, r.a.",topic:"srd\u017Eba",arabic:"\u0644\u064E\u064A\u0652\u0633\u064E \u0627\u0644\u0634\u0651\u064E\u062F\u0650\u064A\u062F\u064F \u0628\u0650\u0627\u0644\u0635\u0651\u064F\u0631\u064E\u0639\u064E\u0629\u0650\u060C \u0625\u0650\u0646\u0651\u064E\u0645\u064E\u0627 \u0627\u0644\u0634\u0651\u064E\u062F\u0650\u064A\u062F\u064F \u0627\u0644\u0651\u064E\u0630\u0650\u064A \u064A\u064E\u0645\u0652\u0644\u0650\u0643\u064F \u0646\u064E\u0641\u0652\u0633\u064E\u0647\u064F \u0639\u0650\u0646\u0652\u062F\u064E \u0627\u0644\u0652\u063A\u064E\u0636\u064E\u0628\u0650",bosnian:"Nije sna\u017Ean onaj ko (druge) obara u hrvanju, nego je sna\u017Ean onaj ko vlada sobom u srd\u017Ebi.",context:null,english:`Allah's Messenger (\uFDFA) said, "The strong is not the one who overcomes the people by his strength, but the strong is the one who controls himself while in anger."`,englishNarrator:"Narrated Abu Huraira:",translatorEn:"Dr. M. Muhsin Khan",grade:"sahih",gradeSource:"Zbirka Sahih al-Bukhari (konsenzus o vjerodostojnosti); ocjena u skupu podataka sunnah.com: \u201ESahih\u201C",sourceUrl:"https://sunnah.com/bukhari:6114"},{id:"bukhari:3559",collection:"Sahih al-Bukhari",collectionAr:"\u0635\u062D\u064A\u062D \u0627\u0644\u0628\u062E\u0627\u0631\u064A",number:"3559",inBook:"Book 61, Hadith 68",narrator:"Abdullah ibn Amr, r.a.",topic:"ahlak",arabic:"\u0625\u0650\u0646\u0651\u064E \u0645\u0650\u0646\u0652 \u062E\u0650\u064A\u064E\u0627\u0631\u0650\u0643\u064F\u0645\u0652 \u0623\u064E\u062D\u0652\u0633\u064E\u0646\u064E\u0643\u064F\u0645\u0652 \u0623\u064E\u062E\u0652\u0644\u0627\u064E\u0642\u064B\u0627",bosnian:"Zaista su me\u0111u najboljima od vas oni najljep\u0161eg ahlaka (pona\u0161anja).",context:"Prenosilac u istom hadisu navodi da Poslanik, s.a.v.s., nikada nije govorio ru\u017Ene rije\u010Di; ovdje je preveden samo citirani dio (matn).",english:'The Prophet (\uFDFA) never used bad language neither a "Fahish nor a Mutafahish. He used to say "The best amongst you are those who have the best manners and character." (See Hadith No. 56 (B) Vol. 8)',englishNarrator:"Narrated `Abdullah bin `Amr:",translatorEn:"Dr. M. Muhsin Khan",grade:"sahih",gradeSource:"Zbirka Sahih al-Bukhari (konsenzus o vjerodostojnosti); ocjena u skupu podataka sunnah.com: \u201ESahih\u201C",sourceUrl:"https://sunnah.com/bukhari:3559"},{id:"bukhari:6464",collection:"Sahih al-Bukhari",collectionAr:"\u0635\u062D\u064A\u062D \u0627\u0644\u0628\u062E\u0627\u0631\u064A",number:"6464",inBook:"Book 81, Hadith 53",narrator:"Ai\u0161a, r.a.",topic:"ustrajnost",arabic:"\u0633\u064E\u062F\u0651\u0650\u062F\u064F\u0648\u0627 \u064 ikada nije poljubio nijedno od svoje desetero djece, dok je Poslanik, s.a.v.s., ljubio unuka Hasana; preveden je samo citirani dio (matn).",english:`Allah's Messenger (\uFDFA) kissed Al-Hasan bin \`Ali while Al-Aqra' bin H\`Abis at-Tamim was sitting beside him. Al-Aqra said, "I have ten children and I have never kissed anyone of them," Allah's Messenger (\uFDFA) cast a look at him and said, "Whoever is not merciful to others will not be treated mercifully."`,englishNarrator:"Narrated Abu Huraira:",translatorEn:"Dr. M. Muhsin Khan",grade:"sahih",gradeSource:"Zbirka Sahih al-Bukhari (konsenzus o vjerodostojnosti); ocjena u skupu podataka sunnah.com: \u201ESahih\u201C",sourceUrl:"https://sunnah.com/bukhari:5997"},{id:"bukhari:2446",collection:"Sahih al-Bukhari",collectionAr:"\u0635\u062D\u064A\u062D \u0627\u0644\u0628\u062E\u0627\u0631\u064A",number:"2446",inBook:"Book 46, Hadith 7",narrator:"Ebu Musa el-E\u0161\u2018ari, r.a.",topic:"zajedni\u0161tvo",arabic:"\u0627\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u064F \u0644\u0650\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u0650 \u0643\u064E\u0627\u0644\u0652\u0628\u064F\u0646\u0652\u064A\u064E\u0627\u0646\u0650 \u064A\u064E\u0634\u064F\u062F\u0651\u064F \u0628\u064E\u0639\u0652\u0636\u064F\u0647\u064F \u0628\u064E\u0639\u0652\u0636\u064B\u0627",bosnian:"Vjernik je vjerniku poput gra\u0111evine \u010Diji dijelovi jedan drugog u\u010Dvr\u0161\u0107uju.",context:"Poslanik, s.a.v.s., pritom je isprepleo prste ruku; preveden je samo citirani dio (matn).",english:'The Prophet (\uFDFA) said, "A believer to another believer is like a building whose different parts enforce each other." The Prophet (\uFDFA) then clasped his hands with the fingers interlaced (while saying that).',englishNarrator:"Narrated Abu Musa:",translatorEn:"Dr. M. Muhsin Khan",grade:"sahih",gradeSource:"Zbirka Sahih al-Bukhari (konsenzus o vjerodostojnosti); ocjena u skupu podataka sunnah.com: \u201ESahih\u201C",sourceUrl:"https://sunnah
